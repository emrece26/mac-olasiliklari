name: Haftalık güncelleme

on:
  schedule:
    - cron: "17 3 * * 2"
    - cron: "17 3 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Veriyi indir
        run: python update_data.py

      - name: Veriyi hazırla
        run: python prepare_data.py

      - name: Geriye dönük testi yenile (her ayın ilk çalıştırmasında)
        run: |
          if [ ! -f backtest_results.json ] || [ "$(date +%d)" -le 7 ]; then
            python backtest.py
          fi

      - name: Siteyi üret
        run: python build_site.py

      - name: İndirilen veriyi depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data backtest_results.json
          git diff --cached --quiet || git commit -m "Veri güncellemesi $(date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
